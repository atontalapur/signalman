rule: vssadmin_delete_shadows.yml
cases:
  - name:   delete all shadows quietly
    expect: match
    event:
      channel:     Security
      event_id:    4688
      NewProcessName:    C:\Windows\System32\vssadmin.exe
      CommandLine:       vssadmin.exe Delete Shadows /All /Quiet
      ParentProcessName: C:\Windows\System32\cmd.exe
      SubjectUserName:   alice

  - name:   listing shadows
    expect: no-match
    event:
      channel:     Security
      event_id:    4688
      NewProcessName:    C:\Windows\System32\vssadmin.exe
      CommandLine:       vssadmin.exe list shadows
      ParentProcessName: C:\Windows\System32\cmd.exe
      SubjectUserName:   alice

  - name:   same command seen by sysmon is another logsource
    expect: no-match
    event:
      channel:     Microsoft-Windows-Sysmon/Operational
      event_id:    1
      Image:       C:\Windows\System32\vssadmin.exe
      CommandLine: vssadmin.exe Delete Shadows /All /Quiet
