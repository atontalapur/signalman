title: Shadow Copies Deleted With Vssadmin
id: d163d664-e1ba-45c3-940e-e16e3e48d3d9
status: test
description: vssadmin deleting volume shadow copies, a step most ransomware takes before encrypting.
author: signalman
tags:
  - attack.impact
  - attack.t1490
logsource:
  product: windows
  service: security
  category: process_creation
detection:
  selection:
    Image|endswith: '\vssadmin.exe'
    CommandLine|contains|all:
      - 'delete'
      - 'shadows'
  condition: selection
level: critical
