title: Whoami Privilege Discovery
id: b4c7e941-03df-4704-bfa8-98b85f190f9a
status: test
description: whoami listing privileges or every token detail, common right after initial access.
author: signalman
tags:
  - attack.discovery
  - attack.t1033
logsource:
  product: windows
  service: security
  category: process_creation
detection:
  selection_img:
    Image|endswith: '\whoami.exe'
  selection_cli:
    CommandLine|windash|contains:
      - ' -priv'
      - ' -all'
  condition: selection_img and selection_cli
level: medium
