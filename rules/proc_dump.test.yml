rule: proc_dump.yml
cases:
  - name:   comsvcs minidump via rundll32
    expect: match
    event:
      channel:     Microsoft-Windows-Sysmon/Operational
      event_id:    1
      Image:       C:\Windows\System32\rundll32.exe
      CommandLine: rundll32.exe comsvcs.dll, MiniDump 624 C:\t.dmp full
      ParentImage: C:\Windows\explorer.exe

  - name:   benign rundll32, printui
    expect: no-match
    event:
      channel:     Microsoft-Windows-Sysmon/Operational
      event_id:    1
      Image:       C:\Windows\System32\rundll32.exe
      CommandLine: rundll32.exe printui.dll,PrintUIEntry /in /n \\srv\hp
      ParentImage: C:\Windows\explorer.exe

  - name:   veeam backup agent is filtered
    expect: no-match
    event:
      channel:     Microsoft-Windows-Sysmon/Operational
      event_id:    1
      Image:       C:\Windows\System32\rundll32.exe
      CommandLine: rundll32.exe comsvcs.dll, MiniDump 624 C:\t.dmp full
      ParentImage: C:\Program Files\Veeam\veeam.exe
