rule: whoami_privileges.yml
cases:
  - name:   whoami /priv
    expect: match
    event:
      channel:     Security
      event_id:    4688
      NewProcessName:    C:\Windows\System32\whoami.exe
      CommandLine:       whoami /priv
      ParentProcessName: C:\Windows\System32\cmd.exe
      SubjectUserName:   alice

  - name:   plain whoami
    expect: no-match
    event:
      channel:     Security
      event_id:    4688
      NewProcessName:    C:\Windows\System32\whoami.exe
      CommandLine:       whoami
      ParentProcessName: C:\Windows\System32\cmd.exe
      SubjectUserName:   alice
