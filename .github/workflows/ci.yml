name: ci
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      has_go: ${{ steps.probe.outputs.has_go }}
      has_compose: ${{ steps.probe.outputs.has_compose }}
    steps:
      - uses: actions/checkout@v7
      - id: probe
        run: |
          echo "has_go=$([ -f go.mod ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has_compose=$([ -f deploy/docker-compose.yml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # Same checks as `make check` locally. Skipped until go.mod lands (Plan A, Task 1).
  go:
    needs: detect
    if: needs.detect.outputs.has_go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: make check

  # Runs against real Redpanda and ClickHouse. Skipped until deploy/docker-compose.yml lands (Plan C).
  integration:
    needs: detect
    if: needs.detect.outputs.has_go == 'true' && needs.detect.outputs.has_compose == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: docker compose -f deploy/docker-compose.yml up -d --wait
      - run: make integration
      - if: always()
        run: docker compose -f deploy/docker-compose.yml down -v

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.7 pyyaml==6.0.3
      - run: make check-python check-backlog

  # PR title is a Conventional Commit; body names the Jira story.
  pr-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            perf
            ci
          # /ship prefixes titles with the version, e.g. "v0.1.0 ci(SIG-11): ...".
          headerPattern: '^(?:v\d+\.\d+\.\d+ )?(\w+)(?:\(([^)]*)\))?!?: (.+)$'
          headerPatternCorrespondence: type, scope, subject
      # Dependabot PRs carry no Jira story; the title check above still applies.
      # Keyed on the PR author, not github.actor: a branch update after a merge
      # to main re-runs the job as whoever clicked, and would fail otherwise.
      - name: Jira key present
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          BODY: ${{ github.event.pull_request.body }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s\n%s' "$TITLE" "$BODY" | grep -Eq 'SIG-[0-9]+'; then
            echo "PR title or body must reference a Jira story (SIG-<n>)"; exit 1
          fi
