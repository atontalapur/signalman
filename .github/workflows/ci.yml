name: ci
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      has_go: ${{ steps.probe.outputs.has_go }}
      has_compose: ${{ steps.probe.outputs.has_compose }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: probe
        run: |
          echo "has_go=$([ -f go.mod ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has_compose=$([ -f deploy/docker-compose.yml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # Same checks as `make check` locally. Skipped until go.mod lands (Plan A, Task 1).
  go:
    needs: detect
    if: needs.detect.outputs.has_go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # The oracle for test/fuzz. Without this venv every oracle test
      # skips and the job is green without having run them.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: |
          python3 -m venv test/fuzz/.venv
          test/fuzz/.venv/bin/pip install --require-hashes -r test/fuzz/requirements.txt
      - run: make check

  # Runs against real Redpanda and ClickHouse from deploy/docker-compose.yml.
  # The DSN matches the compose credentials; a test that needs it fails, not
  # skips, when CI=true and it is unset.
  integration:
    needs: detect
    if: needs.detect.outputs.has_go == 'true' && needs.detect.outputs.has_compose == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SIGNALMAN_CLICKHOUSE_DSN: clickhouse://signalman:signalman@localhost:9000/signalman
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: docker compose -f deploy/docker-compose.yml up -d --wait
      - run: make integration
      - if: always()
        run: docker compose -f deploy/docker-compose.yml down -v

  # Prometheus config, alert rules, and their promtool unit tests. promtool
  # is the official 3.5.0 release (the compose Prometheus version), checked
  # against the sha256 from that release's sha256sums.txt before it runs.
  # make check-alerts fails under CI=true if promtool is missing.
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      PROM_VERSION: 3.5.0
      PROM_SHA256: e811827af26d822afb09a4f28314f61b618b12cff5369835a67f674d8b46f39a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install promtool
        run: |
          tarball="prometheus-${PROM_VERSION}.linux-amd64.tar.gz"
          dir="$RUNNER_TEMP/promtool"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/$tarball" \
            "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/${tarball}"
          echo "${PROM_SHA256}  $dir/$tarball" | sha256sum -c -
          tar -xzf "$dir/$tarball" -C "$dir" --strip-components=1 \
            "prometheus-${PROM_VERSION}.linux-amd64/promtool"
          echo "$dir" >> "$GITHUB_PATH"
      - run: promtool --version
      - run: make check-alerts

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: pip install ruff==0.16.7 pyyaml==6.0.3
      - run: |
          python3 -m venv test/fuzz/.venv
          test/fuzz/.venv/bin/pip install --require-hashes -r test/fuzz/requirements.txt
      - run: make check-python check-backlog

  # PR title is a Conventional Commit; body names the Jira story.
  pr-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            perf
            ci
          # /ship prefixes titles with the version, e.g. "v0.1.0 ci(SIG-11): ...".
          headerPattern: '^(?:v\d+\.\d+\.\d+ )?(\w+)(?:\(([^)]*)\))?!?: (.+)$'
          headerPatternCorrespondence: type, scope, subject
      # Dependabot PRs carry no Jira story; the title check above still applies.
      # Keyed on the PR author, not github.actor: a branch update after a merge
      # to main re-runs the job as whoever clicked, and would fail otherwise.
      - name: Jira key present
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          BODY: ${{ github.event.pull_request.body }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s\n%s' "$TITLE" "$BODY" | grep -Eq 'SIG-[0-9]+'; then
            echo "PR title or body must reference a Jira story (SIG-<n>)"; exit 1
          fi
