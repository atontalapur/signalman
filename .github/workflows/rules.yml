# Rule pull request gates: parse, fixtures, noise budget, latency budget,
# and prefilter, for every rule the PR adds or changes. The full report goes
# to the job summary; a copy cut to fit one PR comment goes to a comment
# that later pushes edit in place.
#
# Two jobs, so the code under review never runs with a write token. `gates`
# builds and runs the PR's signalman with a read-only token; `comment` runs
# only gh, with no checkout, and is the one job allowed to write. A PR from
# a fork gets a read-only token whatever this file asks for, so `comment`
# is skipped there and the job summary carries the report.
#
# The gates build and run the PR's own signalman against the PR's own
# taxonomy and corpus, so a PR that changes rules and also changes cmd/,
# internal/, config/taxonomy/, go.mod, go.sum, the noise corpus, or this
# file would be judged by code it brings. Such a PR fails the job without
# running the gates; split it. A PR that edits this file runs its own copy
# of it, so CODEOWNERS review on .github/ is what holds that edge.
#
# The noise gate needs a corpus. Set the repository variable
# SIGNALMAN_NOISE_CORPUS to a directory in the checkout to turn it on;
# without it the gate reports itself skipped.
name: rules
on:
  pull_request:
    paths:
      - "rules/**"

concurrency:
  group: rules-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      report: ${{ steps.gates.outputs.report || steps.scope.outputs.report }}
      code: ${{ steps.gates.outputs.code || steps.scope.outputs.code }}
    steps:
      # The pull_request checkout is the merge commit, so HEAD^1 is the base
      # branch tip and the diff is what this PR changes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      # Paths are counted, never printed: a file name is PR input, and
      # echoing it would let it carry a workflow command or markdown.
      - name: Refuse a PR that also changes what judges it
        id: scope
        env:
          NOISE_CORPUS: ${{ vars.SIGNALMAN_NOISE_CORPUS }}
        run: |
          paths=(cmd/ internal/ config/taxonomy/ go.mod go.sum .github/workflows/rules.yml)
          if [ -n "$NOISE_CORPUS" ]; then
            paths+=("$NOISE_CORPUS")
          fi
          n=$(( $(git diff --name-only -z HEAD^1 HEAD -- "${paths[@]}" | tr -cd '\0' | wc -c) ))
          if [ "$n" -eq 0 ]; then
            echo "mixed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "<!-- signalman-gates -->"
            echo "## Rule gates"
            echo
            echo "Not run. This PR changes rules and also $n file(s) the gates are built from or read:"
            echo "\`cmd/\`, \`internal/\`, \`config/taxonomy/\`, \`go.mod\`, \`go.sum\`, the noise corpus, or this workflow."
            echo "The rules would be judged by the PR's own code. Split the rule changes into their own PR."
          } > "$RUNNER_TEMP/scope.md"
          cat "$RUNNER_TEMP/scope.md" >> "$GITHUB_STEP_SUMMARY"
          echo "mixed=true" >> "$GITHUB_OUTPUT"
          echo "code=1" >> "$GITHUB_OUTPUT"
          echo "report=$(base64 -w0 < "$RUNNER_TEMP/scope.md")" >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.mixed == 'false'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Changed rules
        if: steps.scope.outputs.mixed == 'false'
        run: git diff --name-only -z --diff-filter=d HEAD^1 HEAD -- rules/ > "$RUNNER_TEMP/changed"
      - if: steps.scope.outputs.mixed == 'false'
        run: go build -o "$RUNNER_TEMP/signalman" ./cmd/signalman
      # Exit 1 is a failed gate and still has a report to post. The step
      # records the code and the next step fails the job with it.
      - name: Run gates
        id: gates
        if: steps.scope.outputs.mixed == 'false'
        env:
          NOISE_CORPUS: ${{ vars.SIGNALMAN_NOISE_CORPUS }}
        run: |
          args=(gates --set rules --changed "$RUNNER_TEMP/changed")
          if [ -n "$NOISE_CORPUS" ]; then
            args+=(--corpus "$NOISE_CORPUS")
          fi
          set +e
          "$RUNNER_TEMP/signalman" "${args[@]}" --comment "$RUNNER_TEMP/comment.md" > "$RUNNER_TEMP/report.md"
          code=$?
          set -e
          touch "$RUNNER_TEMP/comment.md"
          # stdout is the full report; --comment is the same report cut to
          # fit one PR comment. The job summary takes the full one unless it
          # is over the summary's 1 MiB limit.
          if [ "$(wc -c < "$RUNNER_TEMP/report.md")" -le 1000000 ]; then
            cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            cat "$RUNNER_TEMP/comment.md" >> "$GITHUB_STEP_SUMMARY"
            echo "The full report is over the job summary limit. Run signalman gates locally for it." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "report=$(base64 -w0 < "$RUNNER_TEMP/comment.md")" >> "$GITHUB_OUTPUT"
      - name: Fail on a failed gate
        if: steps.scope.outputs.mixed == 'true' || steps.gates.outputs.code != '0'
        env:
          CODE: ${{ steps.gates.outputs.code || steps.scope.outputs.code }}
        run: |
          echo "rule gates failed with code $CODE; see the job summary"
          exit 1

  comment:
    needs: gates
    if: >-
      always()
      && needs.gates.outputs.report != ''
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Post or update the report comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          REPORT: ${{ needs.gates.outputs.report }}
        run: |
          printf '%s' "$REPORT" | base64 -d > report.md
          id=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- signalman-gates -->"))) | .id' \
            | awk 'NR == 1')
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@report.md > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@report.md > /dev/null
          fi
