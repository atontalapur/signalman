# Long-running checks that do not belong on a PR: every fuzz target with a
# real time budget. Crashers are uploaded as artifacts.
name: nightly
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - id: probe
        run: echo "has_go=$([ -f go.mod ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.probe.outputs.has_go == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - if: steps.probe.outputs.has_go == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The differential fuzzer shells out to pySigma as its oracle, and
      # looks for it at test/fuzz/.venv. Installing pySigma anywhere else
      # makes every case in test/fuzz skip without failing.
      - if: steps.probe.outputs.has_go == 'true'
        run: |
          python3 -m venv test/fuzz/.venv
          test/fuzz/.venv/bin/pip install -r test/fuzz/requirements.txt
      - if: steps.probe.outputs.has_go == 'true'
        run: make fuzz FUZZTIME=10m
      # Run again through the differential target, which reports how many
      # cases reached both engines. Executions are not comparisons.
      - if: steps.probe.outputs.has_go == 'true'
        run: make fuzz-differential FUZZTIME=10m
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashers
          path: "**/testdata/fuzz/**"
          if-no-files-found: ignore
