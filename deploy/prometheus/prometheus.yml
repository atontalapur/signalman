# Scrapes signalmand and evaluates the alert rules under alerts/.
#
# signalmand runs on the host (`go run ./cmd/signalmand ...`) and serves
# /metrics on :9464; host.docker.internal reaches it from the container
# (docker-compose.yml maps it to the host gateway on Linux).
#
# The 15s scrape and evaluation intervals are part of the canary's paging
# budget: see the comment on SignalmanCanaryStalled in alerts/absence.yml.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  - job_name: signalmand
    static_configs:
      - targets: ["host.docker.internal:9464"]
  # cmd/differ serves the divergence counters the cutover gates read
  # (docs/cutover.md) on :9466. Down when no differ runs, which the gate
  # checker reports as unchecked rather than as zero divergences.
  - job_name: differ
    static_configs:
      - targets: ["host.docker.internal:9466"]
