# Scrapes signalmand, both signalman-sink lanes, and cmd/differ and
# evaluates the alert rules under alerts/.
#
# Both run on the host (`go run ./cmd/signalmand ...`, `go run
# ./cmd/signalman-sink ...`). signalmand serves /metrics on :9464 and
# signalman-sink on :9465 (alerts lane) and :9467 (-lane events);
# host.docker.internal reaches them from the
# container (docker-compose.yml maps it to the host gateway on Linux).
#
# The 15s scrape and evaluation intervals are part of the canary's paging
# budget: see the comment on SignalmanCanaryStalled in alerts/absence.yml.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  - job_name: signalmand
    static_configs:
      - targets: ["host.docker.internal:9464"]
  - job_name: signalman-sink
    static_configs:
      - targets: ["host.docker.internal:9465"]
  # The events lane (signalman-sink -lane events) fills the table
  # signalman hunt reads. Its lag on events.norm is the retro-hunt's
  # freshness.
  - job_name: signalman-events
    static_configs:
      - targets: ["host.docker.internal:9467"]
  # cmd/differ serves the divergence counters the cutover gates read
  # (docs/cutover.md) on :9466. Down when no differ runs, which the gate
  # checker reports as unchecked rather than as zero divergences.
  - job_name: differ
    static_configs:
      - targets: ["host.docker.internal:9466"]
